<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OPC Community，面向独立开发者、AI 创业者与一人公司的交流社区。" />
    <meta name="theme-color" content="#4238ff" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2716%27%20r%3D%2711%27%20fill%3D%27none%27%20stroke%3D%27%234238ff%27%20stroke-width%3D%278%27%2F%3E%3C%2Fsvg%3E" />
    <!-- 首次绘制前设置主题；独立键不影响帖子与点赞。 -->
    <script>
      (() => {
        let saved
        try { saved = localStorage.getItem('opc-community:theme:v1') } catch {}
        const theme = saved === 'light' || saved === 'dark' ? saved :
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <title>OPC Community · 一个人，也能是一家公司</title>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <!-- 独立的内联 SVG 图标，不引用或裁切设计稿。 -->
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
        <symbol id="icon-code" viewBox="0 0 24 24"><path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18" /></symbol>
        <symbol id="icon-bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M1 12v4m22-4v4M8 16h8"/><circle cx="8" cy="12" r=".5"/><circle cx="16" cy="12" r=".5"/></symbol>
        <symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4" ry="10"/><path d="M2 12h20M4 6h16M4 18h16"/></symbol>
        <symbol id="icon-growth" viewBox="0 0 24 24"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></symbol>
        <symbol id="icon-laptop" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="14" rx="1.5"/><path d="M1 21h22l-2-4H3Z"/></symbol>
        <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
        <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></symbol>
        <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/></symbol>
        <symbol id="icon-like" viewBox="0 0 24 24"><path d="M8 10v11H3V10Zm0 0 4-8c3 0 3 2 2 7h6a2 2 0 0 1 2 2l-2 8a2 2 0 0 1-2 2H8"/></symbol>
        <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="icon-bulb" viewBox="0 0 24 24"><path d="M9 18h6m-6 3h6M8 14a7 7 0 1 1 8 0l-1 2H9Z"/></symbol>
      </defs>
    </svg>

    <div id="app">
      <header class="site-header">
        <div class="container header-inner">
          <a class="brand" href="#main-content" aria-label="OPC Community 首页"><span class="brand-mark" aria-hidden="true"></span><span>OPC Community</span></a>
          <nav class="desktop-nav" aria-label="主导航">
            <a class="nav-link" href="#community">发现</a>
            <a class="nav-link" href="#topics">话题</a>
            <button class="nav-link" type="button" data-notice="活动暂未开放，敬请期待。">活动</button>
          </nav>
          <div class="header-actions">
            <button class="login-button" type="button" data-notice="演示项目暂不提供登录功能">登录</button>
            <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="切换到暗色模式"><svg class="icon theme-moon" aria-hidden="true"><use href="#icon-moon"/></svg><svg class="icon theme-sun" aria-hidden="true"><use href="#icon-sun"/></svg></button>
            <button class="button button-primary header-publish" type="button" data-open-publish>发布</button>
            <button class="icon-button mobile-menu" type="button" aria-label="打开或关闭移动菜单" aria-controls="mobile-navigation" aria-expanded="false"><svg class="icon" aria-hidden="true"><use href="#icon-menu"/></svg></button>
          </div>
        </div>
        <nav id="mobile-navigation" class="container mobile-navigation" aria-label="移动导航" hidden>
          <a href="#community">发现</a><a href="#topics">话题</a>
          <button type="button" data-notice="活动暂未开放，敬请期待。">活动</button>
          <button type="button" data-notice="演示项目暂不提供登录功能">登录</button>
        </nav>
      </header>

      <main id="main-content" class="container main-content">
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-copy">
            <h1 id="hero-title"><span class="hero-opening">一个人，</span><span>也能是<span class="text-brand">一家公司</span></span></h1>
            <p class="hero-subtitle">连接独立创造者，分享经验与灵感</p>
            <div class="hero-actions">
              <a class="button button-primary" href="#posts-list">探索社区<svg class="icon" aria-hidden="true"><use href="#icon-arrow"/></svg></a>
              <button class="button button-outline" type="button" data-open-publish>发布动态</button>
            </div>
          </div>
          <!-- 简洁独立占位组件；后续可替换为独立 Hero 插画资源。 -->
          <div class="hero-art" role="img" aria-label="独立工作台插画占位：电脑与创意图标">
            <div class="art-orbit orbit-one"></div><div class="art-orbit orbit-two"></div>
            <div class="art-badge badge-idea"><svg class="icon" aria-hidden="true"><use href="#icon-bulb"/></svg><span>独立思考<br/>创造价值</span></div>
            <div class="art-badge badge-growth"><svg class="icon" aria-hidden="true"><use href="#icon-growth"/></svg><span>从想法<br/>到产品</span></div>
            <div class="workspace-screen"><div class="screen-toolbar"><i></i><i></i><i></i></div><svg class="screen-code icon" aria-hidden="true"><use href="#icon-code"/></svg><span class="screen-line"></span><span class="screen-line short"></span></div>
            <div class="workspace-base"></div><div class="workspace-desk"></div>
          </div>
        </section>

        <section id="topics" class="topics-section" aria-labelledby="topics-title">
          <div class="section-heading"><h2 id="topics-title">热门话题</h2><button class="view-all" type="button" title="查看全部帖子">查看全部<svg class="icon" aria-hidden="true"><use href="#icon-chevron"/></svg></button></div>
          <div class="topic-grid">
            <button class="topic-card" type="button" data-topic="独立开发" aria-pressed="false" aria-label="独立开发，5245 条讨论"><span class="topic-icon"><svg class="icon" aria-hidden="true"><use href="#icon-code"/></svg></span><span class="topic-copy"><strong>独立开发</strong><span>5245 条讨论</span></span><svg class="icon topic-arrow" aria-hidden="true"><use href="#icon-chevron"/></svg></button>
            <button class="topic-card" type="button" data-topic="AI 工具" aria-pressed="false" aria-label="AI 工具，8921 条讨论"><span class="topic-icon"><svg class="icon" aria-hidden="true"><use href="#icon-bot"/></svg></span><span class="topic-copy"><strong>AI 工具</strong><span>8921 条讨论</span></span><svg class="icon topic-arrow" aria-hidden="true"><use href="#icon-chevron"/></svg></button>
            <button class="topic-card" type="button" data-topic="出海" aria-pressed="false" aria-label="出海，4168 条讨论"><span class="topic-icon"><svg class="icon" aria-hidden="true"><use href="#icon-globe"/></svg></span><span class="topic-copy"><strong>出海</strong><span>4168 条讨论</span></span><svg class="icon topic-arrow" aria-hidden="true"><use href="#icon-chevron"/></svg></button>
            <button class="topic-card" type="button" data-topic="增长" aria-pressed="false" aria-label="增长，3782 条讨论"><span class="topic-icon"><svg class="icon" aria-hidden="true"><use href="#icon-growth"/></svg></span><span class="topic-copy"><strong>增长</strong><span>3782 条讨论</span></span><svg class="icon topic-arrow" aria-hidden="true"><use href="#icon-chevron"/></svg></button>
            <button class="topic-card" type="button" data-topic="远程办公" aria-pressed="false" aria-label="远程办公，3201 条讨论"><span class="topic-icon"><svg class="icon" aria-hidden="true"><use href="#icon-laptop"/></svg></span><span class="topic-copy"><strong>远程办公</strong><span>3201 条讨论</span></span><svg class="icon topic-arrow" aria-hidden="true"><use href="#icon-chevron"/></svg></button>
          </div>
        </section>

        <section id="community" class="community-section" aria-labelledby="community-title">
          <div class="community-toolbar">
            <h2 id="community-title">社区动态</h2>
            <div class="filter-dropdown">
              <button id="topic-filter-button" class="filter-button" type="button" title="筛选话题" aria-haspopup="menu" aria-expanded="false" aria-controls="topic-filter-menu"><span data-filter-label>全部帖子</span><svg class="icon" aria-hidden="true"><use href="#icon-chevron"/></svg></button>
              <div id="topic-filter-menu" class="filter-menu" role="menu" aria-labelledby="topic-filter-button" hidden>
                <button type="button" role="menuitemradio" aria-checked="true" tabindex="-1" data-topic="">全部帖子</button>
                <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-topic="独立开发">独立开发</button>
                <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-topic="AI 工具">AI 工具</button>
                <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-topic="出海">出海</button>
                <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-topic="增长">增长</button>
                <button type="button" role="menuitemradio" aria-checked="false" tabindex="-1" data-topic="远程办公">远程办公</button>
              </div>
            </div>
            <div class="search-field"><label class="sr-only" for="post-search">搜索帖子、话题或作者</label><svg class="icon" aria-hidden="true"><use href="#icon-search"/></svg><input id="post-search" type="search" placeholder="搜索帖子、话题或作者"/></div>
          </div>
          <p id="results-status" class="preview-note" role="status" aria-live="polite"></p>
          <div id="posts-list" class="posts-list"></div>
        </section>
      </main>

      <footer class="site-footer"><div class="container"><p>OPC Community — 面向独立开发者、AI 创业者与一人公司的交流社区</p><p>© 2026 OPC Community. All rights reserved.</p></div></footer>
    </div>

    <dialog id="publish-dialog" class="publish-dialog" aria-labelledby="publish-title" aria-describedby="publish-note">
      <div class="dialog-heading"><h2 id="publish-title">发布动态</h2><button class="icon-button" type="button" data-close-publish aria-label="关闭发布弹窗"><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button></div>
      <p id="publish-note" class="dialog-note">分享你的想法、经验或问题，新帖保存在当前浏览器。</p>
      <form id="publish-form" novalidate>
        <fieldset class="publish-fields"><legend class="sr-only">发布动态表单</legend>
          <div class="form-field"><label for="publish-post-title">标题 <span class="field-hint">必填</span></label><input id="publish-post-title" name="title" type="text" required aria-describedby="title-count publish-error" placeholder="请输入标题"/><span id="title-count" class="field-hint">0/60</span></div>
          <div class="form-field"><label for="publish-post-content">内容 <span class="field-hint">必填</span></label><textarea id="publish-post-content" name="content" required aria-describedby="content-count publish-error" rows="5" placeholder="分享你的想法、经验或问题…"></textarea><span id="content-count" class="field-hint">0/1000</span></div>
          <fieldset class="topic-options"><legend>选择话题</legend><div class="topic-chips"><label class="topic-chip"><input type="checkbox" name="topics" value="独立开发"/><span>独立开发</span></label><label class="topic-chip"><input type="checkbox" name="topics" value="AI 工具"/><span>AI 工具</span></label><label class="topic-chip"><input type="checkbox" name="topics" value="出海"/><span>出海</span></label><label class="topic-chip"><input type="checkbox" name="topics" value="增长"/><span>增长</span></label><label class="topic-chip"><input type="checkbox" name="topics" value="远程办公"/><span>远程办公</span></label></div><p id="topic-selection-hint" class="field-hint" aria-live="polite">已选 0/3 个话题，可不选择话题。</p></fieldset>
        </fieldset>
        <p id="publish-error" class="form-error" role="alert"></p>
        <div class="dialog-actions"><span class="field-hint">分享具体的想法，便于社区交流</span><div><button class="button button-outline" type="button" data-close-publish>取消</button><button class="button button-primary" type="submit">发布</button></div></div>
      </form>
    </dialog>
    <div id="notification" class="notification" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
